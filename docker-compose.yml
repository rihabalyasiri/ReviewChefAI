services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  review-fetcher-service:
    build: ./services/review-fetcher-service
    ports:
      - "8000:8000"
    env_file:
      - ./services/review-fetcher-service/.env
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      - redis

volumes:
  redis-data:
